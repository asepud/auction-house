spring:
  application:
    name: rumah-lelang-api
  datasource:
    url: jdbc:h2:mem:auctiondb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-to-at-least-32-bytes}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  seed:
    admin-email: ${ADMIN_EMAIL:admin@rumahlelang.local}
    admin-password: ${ADMIN_PASSWORD:Admin123!}

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auction_db}
    username: ${DB_USERNAME:auction}
    password: ${DB_PASSWORD:auction}
    driver-class-name: org.postgresql.Driver
  h2:
    console:
      enabled: false
