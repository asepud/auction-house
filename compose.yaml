services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:-lelang}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lelang}
    ports:
      - "5442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/payment_db
      DB_USERNAME: ${POSTGRES_USER:-lelang}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-lelang}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/notification_db
      DB_USERNAME: ${POSTGRES_USER:-lelang}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-lelang}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  auction-service:
    build:
      context: .
      dockerfile: auction-service/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/auction_db
      DB_USERNAME: ${POSTGRES_USER:-lelang}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-lelang}
      PAYMENT_SERVICE_URL: http://payment-service:8081
      NOTIFICATION_SERVICE_URL: http://notification-service:8082
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@rumahlelang.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      payment-service:
        condition: service_started
      notification-service:
        condition: service_started

volumes:
  postgres_data:
